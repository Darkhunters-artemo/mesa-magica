<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Mesa Mágica</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css') }}">
</head>

<body>

<div class="register-page">

    <!-- LADO IZQUIERDO -->

    <div class="register-image">

        <div class="image-overlay">

            <a href="/" class="brand">
                <i class="fa-solid fa-utensils"></i>
                Mesa Mágica
            </a>

            <div class="welcome-text">

                <p>ÚNETE A NOSOTROS</p>

                <h1>
                    Tu próxima
                    <span>experiencia comienza aquí.</span>
                </h1>

                <p>
                    Crea tu cuenta y disfruta de una forma
                    sencilla y elegante de reservar tu mesa.
                </p>

            </div>

        </div>

    </div>


    <!-- FORMULARIO -->

    <div class="register-container">

        <div class="register-box">

            <a href="/" class="back-home">
                <i class="fa-solid fa-arrow-left"></i>
                Volver al inicio
            </a>


            <div class="register-header">

                <div class="logo-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>

                <h2>Crear cuenta</h2>

                <p>
                    Regístrate en Mesa Mágica
                </p>

            </div>


            <form id="registerForm">

                <div class="row">

                    <!-- NOMBRE -->

                    <div class="col-md-6">

                        <div class="form-group">

                            <label for="nombre">
                                Nombre
                            </label>

                            <div class="input-box">

                                <i class="fa-regular fa-user"></i>

                                <input
                                    type="text"
                                    id="nombre"
                                    placeholder="Tu nombre"
                                    required
                                >

                            </div>

                        </div>

                    </div>


                    <!-- APELLIDO -->

                    <div class="col-md-6">

                        <div class="form-group">

                            <label for="apellido">
                                Apellido
                            </label>

                            <div class="input-box">

                                <i class="fa-regular fa-user"></i>

                                <input
                                    type="text"
                                    id="apellido"
                                    placeholder="Tu apellido"
                                    required
                                >

                            </div>

                        </div>

                    </div>

                </div>


                <!-- CORREO -->

                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <div class="input-box">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="correo"
                            placeholder="correo@ejemplo.com"
                            required
                        >

                    </div>

                </div>


                <!-- TELEFONO -->

                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            id="telefono"
                            placeholder="300 000 0000"
                            required
                        >

                    </div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Crea una contraseña"
                            required
                            minlength="6"
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                    <small>
                        Mínimo 6 caracteres.
                    </small>

                </div>


                <!-- CONFIRMAR -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Repite tu contraseña"
                            required
                        >

                    </div>

                </div>


                <!-- TERMINOS -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            Acepto los términos y condiciones
                        </span>

                    </label>

                </div>


                <!-- BOTON -->

                <button
                    type="submit"
                    class="btn-register">

                    <span>Crear mi cuenta</span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <div class="login-text">

                ¿Ya tienes una cuenta?

                <a href="/login">
                    Inicia sesión
                </a>

            </div>


            <div class="security">

                <i class="fa-solid fa-shield-halved"></i>

                Tus datos estarán protegidos

            </div>

        </div>

    </div>

</div>


<script src="{{ url_for('static', filename='js/registro.js') }}"></script>

</body>
</html>
