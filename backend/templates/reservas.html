<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservar Mesa | Mesa Mágica</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/reservas.css') }}">
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a href="/" class="navbar-brand">
            <i class="fa-solid fa-utensils"></i>
            Mesa Mágica
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <i class="fa-solid fa-bars"></i>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a href="/" class="nav-link">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a href="/reservas.html" class="nav-link active">
                        Reservar Mesa
                    </a>
                </li>

                <li class="nav-item">
                    <a href="/login" class="nav-link">
                        Iniciar sesión
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- CONTENIDO -->

<main class="container py-5">

    <div class="text-center mb-5">

        <p class="section-label">
            MESA MÁGICA
        </p>

        <h1>
            Elige tu mesa
        </h1>

        <p class="subtitle">
            Selecciona una mesa disponible para comenzar tu reserva.
        </p>

    </div>


    <!-- LEYENDA -->

    <div class="legend">

        <div>
            <span class="dot available"></span>
            Disponible
        </div>

        <div>
            <span class="dot occupied"></span>
            Ocupada
        </div>

        <div>
            <span class="dot selected"></span>
            Seleccionada
        </div>

    </div>


    <!-- PLANO -->

    <section class="restaurant-floor">

        <div class="entrance">
            <i class="fa-solid fa-door-open"></i>
            Entrada
        </div>


        <button
            class="restaurant-table available"
            data-table="1">

            <span class="chairs top"></span>
            <span class="chairs bottom"></span>
            <span class="chairs left"></span>
            <span class="chairs right"></span>

            <strong>1</strong>

        </button>


        <button
            class="restaurant-table occupied"
            data-table="2">

            <span class="chairs top"></span>
            <span class="chairs bottom"></span>
            <span class="chairs left"></span>
            <span class="chairs right"></span>

            <strong>2</strong>

        </button>


        <button
            class="restaurant-table available"
            data-table="3">

            <span class="chairs top"></span>
            <span class="chairs bottom"></span>
            <span class="chairs left"></span>
            <span class="chairs right"></span>

            <strong>3</strong>

        </button>


        <button
            class="restaurant-table available"
            data-table="4">

            <span class="chairs top"></span>
            <span class="chairs bottom"></span>
            <span class="chairs left"></span>
            <span class="chairs right"></span>

            <strong>4</strong>

        </button>


        <button
            class="restaurant-table occupied"
            data-table="5">

            <span class="chairs top"></span>
            <span class="chairs bottom"></span>
            <span class="chairs left"></span>
            <span class="chairs right"></span>

            <strong>5</strong>

        </button>


        <button
            class="restaurant-table available"
            data-table="6">

            <span class="chairs top"></span>
            <span class="chairs bottom"></span>
            <span class="chairs left"></span>
            <span class="chairs right"></span>

            <strong>6</strong>

        </button>


        <button
            class="restaurant-table available"
            data-table="7">

            <span class="chairs top"></span>
            <span class="chairs bottom"></span>
            <span class="chairs left"></span>
            <span class="chairs right"></span>

            <strong>7</strong>

        </button>


        <div class="cashier">

            <i class="fa-solid fa-cash-register"></i>

            Recepción / Caja

        </div>

    </section>


    <!-- INFORMACIÓN -->

    <div class="reservation-info">

        <div>

            <i class="fa-solid fa-circle-info"></i>

            <div>

                <strong>
                    ¿Cómo reservar?
                </strong>

                <p>
                    Haz clic sobre una mesa disponible.
                </p>

            </div>

        </div>

        <span id="selectedMessage">
            Ninguna mesa seleccionada
        </span>

    </div>

</main>


<!-- MODAL RESERVA -->

<div
    class="modal fade"
    id="reservationModal"
    tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="fa-solid fa-calendar-check"></i>

                    Reservar Mesa
                    <span id="modalTable"></span>

                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <form id="reservationForm">

                    <div class="mb-3">

                        <label>
                            Nombre completo
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            class="form-control"
                            placeholder="Tu nombre"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>
                            Teléfono
                        </label>

                        <input
                            type="tel"
                            id="telefono"
                            class="form-control"
                            placeholder="300 000 0000"
                            required>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>
                                Fecha
                            </label>

                            <input
                                type="date"
                                id="fecha"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label>
                                Hora
                            </label>

                            <input
                                type="time"
                                id="hora"
                                class="form-control"
                                required>

                        </div>

                    </div>


                    <div class="mb-3">

                        <label>
                            Número de personas
                        </label>

                        <select
                            id="personas"
                            class="form-select"
                            required>

                            <option value="">
                                Selecciona...
                            </option>

                            <option value="1">
                                1 persona
                            </option>

                            <option value="2">
                                2 personas
                            </option>

                            <option value="3">
                                3 personas
                            </option>

                            <option value="4">
                                4 personas
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label>
                            Observaciones
                        </label>

                        <textarea
                            id="observaciones"
                            class="form-control"
                            rows="3"
                            placeholder="¿Alguna ocasión especial?">
                        </textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn-reserve">

                        Confirmar reserva

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="{{ url_for('static', filename='js/reservas.js') }}"></script>

</body>
</html>
